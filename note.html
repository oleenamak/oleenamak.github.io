<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting · Oleena Mak</title>
  <meta name="robots" content="noindex">
  <script>
    // Old article links were note.html?n=<slug>; articles now live at notes/<slug>.html
    (function () {
      var slug = new URLSearchParams(location.search).get("n") || "";
      location.replace(/^[a-z0-9-]+$/.test(slug) ? "notes/" + slug + ".html" : "notes.html");
    })();
  </script>
</head>
<body><a href="notes.html">Go to all writing</a></body>
</html>
