<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minoan Customer Lifecycle</title>
<style>
:root{font:16px system-ui,sans-serif;color:#202b3c;background:#f4f7fa;--border:#c0cbd9;--canvas:#f4f7fa;--mono:ui-monospace,monospace}
*{box-sizing:border-box}body{margin:0}button,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid #235c83;outline-offset:3px}
#view{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(#c7d3df 1px,transparent 1px) 0 0/16px 16px}
#view.dragging{cursor:grabbing}#world{position:absolute;width:1736px;height:666px;transform-origin:0 0;isolation:isolate}
h1{position:absolute;left:28px;top:18px;margin:0;font-size:36px;letter-spacing:-.045em}
.subtitle{position:absolute;top:67px;left:29px;margin:0;color:#32635e;font:700 13px var(--mono);text-transform:uppercase}
.column{position:absolute;top:103px;width:226px;height:554px;border:1px solid #cdd9e6;border-radius:8px;background:linear-gradient(#e9f0f8 0 81px,#ffffffb8 81px)}
.lane{position:absolute;top:114px;width:206px;padding:7px 10px;background:#26364d;color:white;border-radius:5px;font-weight:650;font-size:14px}
.lane:not(.last)::after{content:'→';position:absolute;left:calc(100% + 12px);color:#546d88}
svg{position:absolute;inset:0;pointer-events:none}svg path{fill:none;stroke:#546d88;stroke-width:2}
svg .proposed{stroke:#5073a4;stroke-dasharray:5 4}
.card{position:absolute;width:170px;height:75px;padding:8px 10px;border:1px solid var(--border);border-left:4px solid var(--type);border-radius:5px;background:#fff;text-align:left;box-shadow:0 2px 5px #22364c0a;line-height:1.15;font-weight:650}
.event{--type:#236247;--wash:#edf7ef}.logic{--type:#355d77;--wash:#e9f1fb}.email{--type:#3c5e90;--wash:#eef3ff}
.tag{display:block;margin-bottom:4px;color:var(--type);font:700 11px var(--mono);text-transform:uppercase}
.event .tag::before{content:'●';margin-right:5px}.card:hover,.card[aria-pressed=true]{background:var(--wash)}
.card[aria-pressed=true]{outline:2px solid #235c83;outline-offset:3px}
.card.logic{border:0;background:transparent;box-shadow:none;isolation:isolate;text-align:center;padding:6px 33px;font-size:14px}
.card.logic::before,.card.logic::after{content:'';position:absolute;inset:0;z-index:-2;background:var(--type);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.card.logic::after{inset:2px 4px;z-index:-1;background:var(--wash)}
.toolbar,.legend,.panel{position:fixed;background:white;border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 22px #23334b14;z-index:1}
.toolbar{top:12px;left:12px;display:flex;flex-wrap:wrap;gap:6px;padding:6px;max-width:calc(100% - 24px)}
.toolbar button,.toolbar select,.close{border:1px solid var(--border);border-radius:5px;background:#f8fafc;padding:5px 9px;font-size:14px;font-weight:600}
.legend{bottom:12px;left:12px;display:flex;flex-wrap:wrap;gap:5px;padding:6px;max-width:calc(100% - 24px)}
.legend span{padding:2px 6px;border:1px solid var(--type);border-left-width:4px;border-radius:4px;background:var(--wash);font-size:12px}
.legend .email{border-style:dashed}
.panel{z-index:2;right:12px;bottom:12px;width:min(390px,calc(100% - 24px));max-height:44dvh;overflow:auto;padding:16px 48px 16px 18px}
.panel h2{margin:0;font-size:21px}.panel p{margin:8px 0 0;color:#47566b;line-height:1.45}.close{position:absolute;right:8px;top:8px}
.map-link{color:#235c83;font-size:13px;font-weight:650;white-space:nowrap}.toolbar{flex-wrap:wrap}.tag{letter-spacing:0}
.notification{position:absolute;z-index:1;display:grid;place-items:center;width:24px;height:24px;padding:0;border:1px solid #775514;border-radius:50%;background:#fff4cf;color:#68480d}.notification:hover,.notification[aria-pressed=true]{background:#ffe398}.notification svg,.legend .notification-key svg{position:static}.notification svg path,.legend .notification-key svg path{stroke:currentColor}.legend .notification-key{display:inline-flex;align-items:center;gap:5px;--type:#775514;--wash:#fff4cf}
/* oleenamak.ca theme: white paper, mono interface text, small serif prose */
:root{--ink:#171717;--muted:#666;--rule:#e5e5e5;--border:#e0e0e0;--serif:Georgia,"Times New Roman",serif;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:#fff;font:14px/1.4 var(--serif)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#view{background:radial-gradient(#e4e4e4 1px,transparent 1px) 0 0/16px 16px}
h1{font:400 32px/1.1 var(--serif);letter-spacing:-.01em}
.subtitle{top:62px;color:var(--muted);font:400 11.5px/1.4 var(--mono);text-transform:none}
.column{border:1px solid var(--rule);border-radius:4px;background:#fffffff2}
.lane{background:var(--ink);border-radius:3px;font:500 11.5px/1.4 var(--mono);padding:8px 10px}
.lane:not(.last)::after{color:#aaa}
svg path{stroke:#a3a3a3;stroke-width:1.5}svg .proposed{stroke:#a3a3a3;stroke-dasharray:4 4}
.card{border-color:var(--border);border-radius:4px;box-shadow:none;font:400 14px/1.2 var(--serif)}
.card[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}
.card.logic{font:400 12.5px/1.1 var(--serif);padding:4px 26px}.card.logic .tag{margin-bottom:2px}
.tag{font:400 10.5px/1.3 var(--mono);letter-spacing:.02em;text-transform:none}
.event{--type:#3d6b52;--wash:#f3f7f4}.logic{--type:#4a6175;--wash:#f2f5f8}.email{--type:#4d6390;--wash:#f4f6fb}
.handoff{--type:#8a5a26;--wash:#fbf5ec}.state{--type:#666;--wash:#f5f5f5}.ads{--type:#63528a;--wash:#f6f3fa}
.card.email{border-radius:4px;font-size:20px}
.card.email::after,.legend .email::before{background:#b8433a}
.email-label{color:var(--ink);font:400 13px/1.2 var(--serif)}
.toolbar,.legend,.panel{border-color:var(--rule);border-radius:4px;box-shadow:0 12px 40px #00000012}
.toolbar button,.toolbar select,.close{border:1px solid #ccc;border-radius:3px;background:#fff;font:400 12px/1.3 var(--mono);padding:6px 10px}
.toolbar button:hover,.close:hover{background:#f5f5f5}
.legend span{border-radius:3px;font:400 11px/1.4 var(--mono)}
.panel h2{font:400 18px/1.3 var(--serif)}.panel p{color:var(--muted);font:14.5px/1.6 var(--serif)}
.close{font-size:16px;line-height:1;padding:4px 8px;color:var(--muted)}
.map-link{align-self:center;color:var(--ink);font:400 12px/1.3 var(--mono);text-underline-offset:3px;text-decoration-color:#ccc;padding:0 4px}
.exit-note{color:var(--muted);font:400 13px/1.4 var(--serif)}
.notification{border-color:#9a7a3c;background:#fdf6e3;color:#6e5214}.notification:hover,.notification[aria-pressed=true]{background:#f7e7b8}
</style>
</head>
<body>
<main>
<div id="view" tabindex="0" aria-label="Minoan customer lifecycle map. Drag or use arrow keys to pan.">
<div id="world">
<h1>Minoan Customer Lifecycle</h1><p class="subtitle">Member journey · working draft</p>
</div>
</div>
<nav class="toolbar" aria-label="Map controls">
<button id="out" aria-label="Zoom out">−</button><button id="in" aria-label="Zoom in">+</button><button id="fit">Fit map</button>
<select id="jump" aria-label="Jump to section"><option value="">Jump to section</option></select><a class="map-link" href="minoan-signup-map.html" target="_blank" rel="noopener">Sign-up detail ↗</a>
</nav>
<aside class="legend" aria-label="Map key"><span class="event">Event</span><span class="logic">Routing</span><span class="email">Dashed path · proposed</span><span class="notification-key"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 8-3 8-3 10h18c0-2-3-2-3-10M10 21h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Potential notification</span></aside>
<section class="panel" id="panel" aria-labelledby="title" hidden>
<button class="close" id="close" aria-label="Close details">×</button><span class="tag" id="kind"></span><h2 id="title"></h2><p id="details"></p>
</section>
</main>
<script>
const cards = [
 [
  "signup",
  "event",
  "Sign-up started",
  "Record when a prospect begins either path. Capture the selected path when available and join start events to the eventual member ID."
 ],
 [
  "airbnb",
  "event",
  "Airbnb connected",
  "Track successful connection. Eligible hosts may go directly to approval. Confirm which outcomes are emitted when connection or eligibility checks fail."
 ],
 [
  "manual",
  "event",
  "Manual application started",
  "Track entry into the manual application and capture member type when provided."
 ],
 [
  "intent",
  "event",
  "Shopping intent provided",
  "Capture project stage, categories, furnishing budget, and delivery timing where supplied."
 ],
 [
  "verify",
  "event",
  "Verification provided",
  "Record whether listing or other verification information was supplied. An optional document can support review."
 ],
 [
  "submitted",
  "event",
  "Application submitted",
  "Record the transition into review. Track time from submission to approval and confirm which pending or more-information outcomes are available."
 ],
 [
  "approved",
  "event",
  "Membership approved",
  "Send the transactional confirmation and route immediately into standard or high-touch onboarding. Track the approval timestamp and use it as the baseline for first-order conversion."
 ],
 [
  "welcome-click",
  "event",
  "Welcome link clicked",
  "Track destination and campaign when a member clicks through. If testing a category-led welcome, use selected-category visits as a diagnostic and first orders as the outcome."
 ],
 [
  "session",
  "event",
  "First approved session",
  "Record the first signed-in session after approval, whether the member arrives from the welcome email, immediately after Airbnb approval, or through another route."
 ],
 [
  "category",
  "event",
  "Category viewed",
  "Join category views to the member and compare browsed categories with stated interest where available."
 ],
 [
  "product",
  "event",
  "Product viewed",
  "Capture product and category when the approved member opens a product page."
 ],
 [
  "cart",
  "event",
  "Item added to cart",
  "Record the product and account or cart ID. Check that cart events can be linked to a subsequent order."
 ],
 [
  "checkout",
  "event",
  "Checkout started",
  "Track checkout entry and the share of member checkouts that produce a qualifying first order."
 ],
 [
  "first",
  "event",
  "First order placed",
  "Use the first qualifying order as the proposed activation milestone. Measure approval-to-first-order conversion and time to first order."
 ],
 [
  "ship",
  "event",
  "Shipment dispatched",
  "Capture item-level shipment status and tracking information. An order can ship in multiple parts."
 ],
 [
  "delivered",
  "event",
  "Delivery confirmed",
  "Capture delivery by shipment or item. Validate when the data supports an order-level delivery milestone."
 ],
 [
  "issue",
  "event",
  "Delivery issue reported",
  "Route reported issues to support and pause promotional messages while the issue remains open."
 ],
 [
  "next",
  "logic",
  "Next buying occasion identified",
  "Use project timing or prior purchase category to distinguish a new property, a refresh, or a restock."
 ],
 [
  "expand-browse",
  "event",
  "Member shops again",
  "Track the first qualifying shopping session after purchase and which categories the member browses."
 ],
 [
  "expand-cart",
  "event",
  "Item added to a new cart",
  "Track cart activity after the previous purchase and link it to a later order."
 ],
 [
  "repeat",
  "event",
  "Repeat order placed",
  "Measure second-order conversion and time to second purchase. Track orders for additional properties where the data supports it."
 ],
 [
  "inactive",
  "logic",
  "Buyer qualifies as lapsed",
  "Use time since the last order and typical buying cadence. Include one-time and repeat buyers. Approved members who have yet to order stay in activation."
 ],
 [
  "return",
  "event",
  "Shopping session resumed",
  "Track a signed-in return session after lapse as an early signal. A buyer can also return organically."
 ],
 [
  "reactivated-order",
  "event",
  "Reactivation order placed",
  "Use the first qualifying order after lapse. Compare incremental orders with the holdout and report the measurement window."
 ]
];
const notifications = {"approved":["Category-led welcome","Test a category-led welcome for manually approved members with a recorded category preference."],"delivered":["Post-delivery check-in","Test a check-in after confirmed delivery. Use the delivery event to set timing."],"inactive":["Win-back message","Test a message tied to a relevant project or restock. Record message eligibility and campaign assignment to support a holdout."]};
const bellIcon = "<svg viewBox=\"0 0 24 24\" width=\"15\" height=\"15\" aria-hidden=\"true\"><path d=\"M18 8a6 6 0 0 0-12 0c0 8-3 8-3 10h18c0-2-3-2-3-10M10 21h4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>";
const stages = [["Sign-up","signup"],["Onboarding","approved"],["Activation","category"],["Post-purchase engagement","ship"],["Expansion","next"],["Reactivation","inactive"]];
const positions = {"signup":[171,166],"airbnb":[267,272],"manual":[47,272],"intent":[47,365],"verify":[47,458],"submitted":[47,551],"approved":[543,203],"welcome-click":[543,296],"session":[543,389],"category":[791,203],"product":[791,296],"cart":[791,389],"checkout":[791,482],"first":[791,575],"ship":[1039,203],"delivered":[1039,296],"issue":[1039,389],"next":[1287,203],"expand-browse":[1287,296],"expand-cart":[1287,389],"repeat":[1287,482],"inactive":[1535,203],"return":[1535,296],"reactivated-order":[1535,389]};
const routes = [["M256 241 V255 H132 V272",false],["M256 241 V255 H352 V272",false],["M132 347 V365",false],["M132 440 V458",false],["M132 533 V551",false],["M437 309 H504 V240 H543",false],["M217 588 H504 V240 H543",false],["M628 278 V296",true],["M628 371 V389",true],["M876 278 V296",true],["M876 371 V389",true],["M876 464 V482",true],["M876 557 V575",true],["M1124 278 V296",true],["M1372 278 V296",true],["M1372 371 V389",true],["M1372 464 V482",true],["M1620 278 V296",true],["M1620 371 V389",true],["M713 240 H735 V426 H713",true],["M1124 371 V389",true],["M713 426 H752 V240 H791",true],["M961 612 H1000 V240 H1039",true],["M1209 333 H1248 V240 H1287",true],["M1457 519 H1496 V240 H1535",true],["M1124 371 V385 H1228 V625 H1514 V240 H1535",true]];
const get = id => document.getElementById(id);
const view = get('view'), world = get('world'), panel = get('panel');
const kinds = {event:'Event',logic:'Routing'};
let x = 0, y = 0, scale = 1, drag, selected;
for (const [index,[label,id]] of stages.entries()) {
 const column = document.createElement('div');
 column.className = 'column';
 const offset = index ? (index + 1) * 248 : 0;
 column.style.left = (19 + offset) + 'px';
 if (!index) column.style.width = '474px';
 column.setAttribute('aria-hidden','true');
 const lane = document.createElement('div');
 lane.className = index === stages.length - 1 ? 'lane last' : 'lane';
 lane.style.left = (29 + offset) + 'px';
 if (!index) lane.style.width = '454px';
 lane.textContent = label;
 world.append(column,lane);
 get('jump').add(new Option(label,id));
}
const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
svg.setAttribute('width','1736');
svg.setAttribute('height','666');
svg.setAttribute('aria-hidden','true');
svg.innerHTML = '<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" style="stroke:context-stroke"/></marker></defs>';
for (const [route,proposed] of routes) {
 const path = document.createElementNS(svg.namespaceURI,'path');
 path.setAttribute('d',route);
 path.setAttribute('marker-end','url(#arrow)');
 if (proposed) path.classList.add('proposed');
 svg.append(path);
}
world.append(svg);
for (const [id,type,title,detail] of cards) {
 const button = document.createElement('button');
 const [left,top] = positions[id];
 button.className = 'card ' + type;
 button.style.left = left + 'px';
 button.style.top = top + 'px';
 button.setAttribute('aria-pressed','false');
 const tag = document.createElement('span');
 tag.className = 'tag';
 tag.textContent = kinds[type];
 button.append(tag,title);
 bindDetails(button,id,kinds[type],title,detail);
 const notification = notifications[id];
 if (notification) {
  const badge = document.createElement('button');
  badge.className = 'notification';
  badge.style.left = (left + 149) + 'px';
  badge.style.top = (top - 8) + 'px';
  badge.innerHTML = bellIcon;
  badge.title = 'Potential notification: ' + notification[0];
  badge.setAttribute('aria-label',badge.title);
  bindDetails(badge,id,'Potential notification',...notification);
 }
}
function bindDetails(button,id,kind,title,detail) {
 button.setAttribute('aria-pressed','false');
 button.onclick = () => {
  if (selected === button) { closePanel(); return; }
  selected?.setAttribute('aria-pressed','false');
  selected = button;
  button.setAttribute('aria-pressed','true');
  get('kind').textContent = kind;
  get('title').textContent = title;
  get('details').textContent = detail;
  panel.hidden = false;
 };
 button.onfocus = () => {
  const rect = button.getBoundingClientRect();
  if (rect.top < 65 || rect.bottom > view.clientHeight - 55 || rect.left < 0 || rect.right > view.clientWidth) jump(id);
 };
 world.append(button);
}
function closePanel(restoreFocus = false) {
 const button = selected;
 button?.setAttribute('aria-pressed','false');
 selected = null;
 panel.hidden = true;
 if (restoreFocus) button?.focus({preventScroll:true});
}
get('close').onclick = () => closePanel(true);
function draw() { world.style.transform = `translate(${x}px,${y}px) scale(${scale})`; }
function fit() {
 scale = Math.max(.12,Math.min(1.2,(view.clientWidth - 24) / 1736,(view.clientHeight - 128) / 666));
 x = (view.clientWidth - 1736 * scale) / 2;
 y = (view.clientHeight - 666 * scale) / 2;
 draw();
}
function jump(id) {
 const [left,top] = positions[id];
 scale = Math.min(1,(view.clientWidth - 36) / 350);
 x = view.clientWidth / 2 - (left + 85) * scale;
 y = view.clientHeight / 2 - (top + 37) * scale;
 draw();
}
function zoom(factor,px = view.clientWidth / 2,py = view.clientHeight / 2) {
 const next = Math.max(.1,Math.min(2.5,scale * factor));
 x = px - (px - x) * next / scale;
 y = py - (py - y) * next / scale;
 scale = next;
 draw();
}
get('fit').onclick = fit;
get('in').onclick = () => zoom(1.25);
get('out').onclick = () => zoom(.8);
get('jump').onchange = event => {
 if (event.target.value) jump(event.target.value);
 event.target.value = '';
};
view.addEventListener('pointerdown',event => {
 if (event.button !== 0 || event.target.closest('button')) return;
 drag = [event.clientX - x,event.clientY - y];
 view.setPointerCapture(event.pointerId);
 view.classList.add('dragging');
});
view.addEventListener('pointermove',event => {
 if (!drag) return;
 x = event.clientX - drag[0];
 y = event.clientY - drag[1];
 draw();
});
view.addEventListener('lostpointercapture',() => {
 drag = null;
 view.classList.remove('dragging');
});
view.addEventListener('wheel',event => {
 event.preventDefault();
 zoom(event.deltaY < 0 ? 1.12 : 1 / 1.12,event.clientX,event.clientY);
},{passive:false});
view.addEventListener('keydown',event => {
 const delta = {ArrowLeft:[45,0],ArrowRight:[-45,0],ArrowUp:[0,45],ArrowDown:[0,-45]}[event.key];
 if (!delta) return;
 event.preventDefault();
 x += delta[0];
 y += delta[1];
 draw();
});
document.addEventListener('keydown',event => {
 if (event.key === 'Escape' && selected) closePanel(true);
});
window.addEventListener('resize',fit);
fit();
</script>
</body>
</html>
