<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 262" width="670" height="262"
     font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <style>
    .box  { fill: none;    stroke: #17181a; stroke-width: 1; }
    .end  { fill: #e5e3dc; stroke: #17181a; stroke-width: 1; }
    .t    { font-size: 11px; fill: #1f1f22; text-anchor: middle; }
    .line { stroke: #17181a; stroke-width: 1.25; fill: none; }
    .head { fill: #17181a; }
  </style>

  <!-- attribution, feeding the distribution layer -->
  <rect class="box" x="428.5" y="20.5" width="115" height="40"/>
  <text class="t" x="486" y="45">Attribution</text>
  <path class="line" d="M486 61 V92"/><path class="head" d="M481 92 h10 l-5 6 z"/>

  <!-- main flow -->
  <rect class="end" x="0.5"   y="98.5" width="75"  height="46"/>
  <text class="t" x="38"  y="126">Project</text>

  <rect class="box" x="116.5" y="98.5" width="115" height="46"/>
  <text class="t" x="174" y="118">Targeting/</text><text class="t" x="174" y="133">Segmentation</text>

  <rect class="box" x="272.5" y="98.5" width="115" height="46"/>
  <text class="t" x="330" y="118">Smart Contract/</text><text class="t" x="330" y="133">Campaign</text>

  <rect class="box" x="428.5" y="98.5" width="115" height="46"/>
  <text class="t" x="486" y="118">Distributors/</text><text class="t" x="486" y="133">Channels</text>

  <rect class="end" x="584.5" y="98.5" width="85"  height="46"/>
  <text class="t" x="627" y="126">Users</text>

  <path class="line" d="M76 121.5 H110"/><path class="head" d="M110 116.5 v10 l6 -5 z"/>
  <path class="line" d="M232 121.5 H266"/><path class="head" d="M266 116.5 v10 l6 -5 z"/>
  <path class="line" d="M388 121.5 H422"/><path class="head" d="M422 116.5 v10 l6 -5 z"/>
  <path class="line" d="M544 121.5 H578"/><path class="head" d="M578 116.5 v10 l6 -5 z"/>

  <!-- measurement loop back into targeting -->
  <rect class="box" x="380.5" y="200.5" width="150" height="42"/>
  <text class="t" x="455" y="226">Onchain data analysis</text>

  <path class="line" d="M627 145 V221.5 H536"/><path class="head" d="M536 216.5 v10 l-6 -5 z"/>
  <path class="line" d="M380 221.5 H174 V151"/><path class="head" d="M169 151 h10 l-5 -6 z"/>
</svg>
