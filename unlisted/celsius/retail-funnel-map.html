const types = {
  channel: ['Channel', 'referrals promos founder social seo'],
  action: ['Event', 'signup kycStart firstDeposit accreditedApply buyCel'],
  decision: ['Logic', 'kycCheck segment depositCheck accreditedCheck'],
  segment: ['Segment track', 'firstTime experienced'],
  automation: ['Automation', 'kycReminders welcomeEmail promoEmail reminders weeklyEmail amaReminder'],
  push: ['Push notification', 'weeklyPush'],
  program: ['Program', 'ama earnRates depositPromos whiteGlove vipPromos tiers boosted ambassador'],

  content: ['Content', 'ambassadorContent'],
};
const cardTypes = Object.fromEntries(Object.entries(types).flatMap(([kind,[label, ids]]) =>

));
const links = [
  ...['referrals','promos','founder','social','seo'].map(id => [id,'signup','capture-input']),
  ['signup','kycStart'], ['kycStart','kycCheck'], ['kycCheck','kycReminders','side','No'], ['kycReminders','kycCheck',false,'Resume'],
  ['kycCheck','welcomeEmail','handoff','Verified'], ['welcomeEmail','promoEmail'], ['promoEmail','segment'],
  ['segment','firstTime',false,'Yes'], ['segment','experienced','side','No'],
  ['firstTime','depositCheck','handoff'], ['experienced','depositCheck','handoff'],
  ['depositCheck','firstDeposit',false,'Yes'], ['depositCheck','reminders','side','No'],
  ['reminders','firstDeposit',false,'Deposited'],
  ['firstDeposit','nurture','handoff'], ['amaReminder','ama'],
  ['nurture','borrow','handoff'], ['nurture','accreditedApply','handoff'],
  ['accreditedApply','accreditedCheck'], ['accreditedCheck','hnw','handoff','Yes'], ['accreditedCheck','nurture','back','No'],
  ['hnw','buyCel','handoff'], ['nurture','buyCel','under','CEL promotions'],
  ['buyCel','tiers'], ['tiers','boosted'],
  ['tiers','ambassador','handoff'], ['ambassador','ambassadorContent'],
  ['ambassadorContent','referrals','flywheel','Drives referrals and sign-ups']
];
const greenLabels = ['Yes','Deposited','Verified','Resume'];
const board = document.querySelector('#board');

const buttons = {};
const legend = document.querySelector('#legend-items');
for (const [kind,[label]] of Object.entries(types)) {

}
// Groups: nurture is a stream of programs, and accredited clients got their own track.
const groupColumns = {};
for (const [id,column,top,height,name] of [['nurture',4,162,420,'Grow deposits'],['hnw',6,162,358,'Accredited investors']]) {
  const group = document.createElement('div');

}
const bands = [];
for (const [x,y,title] of columns) {

for (const [id,[column,y,title,subtitle,,key]] of Object.entries(cards)) {
  const node = document.createElement('button');
  node.type = 'button';
  node.className = key ? 'node key' : 'node';

function drawLinks() {
  edgeGroup.replaceChildren();
  for (const [from,to,route,label] of links) {
    const a = buttons[from], b = buttons[to];
    const ax = a.offsetLeft, ay = a.offsetTop, bx = b.offsetLeft, by = b.offsetTop;
    let start = ay + a.offsetHeight / 2, end = by + b.offsetHeight / 2;
    // Lines leaving a group start level with their target, so each branch reads as its own path.
    if (from === 'nurture' && route === 'handoff') start = end;
    let d, labelX, labelY;
    if (route === 'capture-input') {
      const right = ax + a.offsetWidth, gutter = (right + bx) / 2;
      d = `M${right} ${start} H${gutter} V${end} H${bx-4}`;
    } else if (route === 'side') {
      const right = ax + a.offsetWidth, targetRight = bx + b.offsetWidth;
      const gutter = Math.max(right, targetRight) + 16;
      d = `M${right} ${start} H${gutter} V${end} H${targetRight+4}`;
      labelX = gutter;
      labelY = start + 44;
    } else if (route === 'handoff') {
      const right = ax + a.offsetWidth, middle = (right + bx) / 2;
      d = `M${right} ${start} H${middle} V${end} H${bx-4}`;
      labelX = middle;
      labelY = (start + end) / 2;
    } else if (route === 'back') {
      d = `M${ax} ${start} H${bx+b.offsetWidth+4}`;
      labelX = (ax + bx + b.offsetWidth) / 2;
      labelY = start - 8;
    } else if (route === 'under') {
      // Runs below the expansion lanes and climbs into CEL from the left.
      const gutter = (columns[6][0] + 194 + columns[7][0]) / 2;
      d = `M${ax+a.offsetWidth/2} ${ay+a.offsetHeight} V662 H${gutter} V${end} H${bx-4}`;
      labelX = 1480;
      labelY = 654;
    } else if (route === 'flywheel') {
      d = `M${ax+a.offsetWidth/2} ${ay+a.offsetHeight} V740 H14 V${end} H${bx-4}`;
      labelX = 1100;
      labelY = 732;
    } else if (cards[from] && cards[to] && cards[from][0] === cards[to][0]) {
      const x = bx + b.offsetWidth / 2;
      labelX = x;
      labelY = by > ay ? (ay + a.offsetHeight + by) / 2 + 4 : (by + b.offsetHeight + ay) / 2 + 4;
      d = by > ay ? `M${x} ${ay+a.offsetHeight} V${by-3}` : `M${x} ${ay} V${by+b.offsetHeight+3}`;
    } else {
      const x = ax + a.offsetWidth, middle = (x + bx) / 2;
      d = `M${x} ${start} C${middle} ${start} ${middle} ${end} ${bx-3} ${end}`;
    }
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',d);
    if (route !== 'capture-input' || from === 'seo') path.setAttribute('marker-end','url(#arrow)');
    if (route === 'back' || route === 'flywheel') {
      path.setAttribute('class','edge-return');
    } else if (['automation','push'].includes(cardTypes[from]?.kind) || ['automation','push'].includes(cardTypes[to]?.kind)) {
      path.setAttribute('class','edge-automation');
    } else {
      path.setAttribute('stroke-width','2.15');
    }
    edgeGroup.append(path);
    if (label) {
      const annotation = document.createElementNS('http://www.w3.org/2000/svg','text');
      annotation.setAttribute('x',labelX);
      annotation.setAttribute('y',labelY);
      annotation.setAttribute('class',greenLabels.includes(label) ? 'edge-label' : 'edge-label no');
      annotation.textContent = label;
      edgeGroup.append(annotation);
    }
  }
}
let scale = 1, x = 0, y = 0, drag, selected;
function draw() { board.style.transform = `translate(${x}px,${y}px) scale(${scale})`; }
function frame(left,top,width,height) {
  scale = Math.max(.12, Math.min(1.25,(viewport.clientWidth-24)/width,(viewport.clientHeight-84)/height));
  x = (viewport.clientWidth-width*scale)/2-left*scale;
  y = 56+(viewport.clientHeight-56-height*scale)/2-top*scale;
  draw();
}
function fit() { frame(4,10,2226,760); }
function zoom(factor,cx,cy) {
  const next = Math.max(.12,Math.min(2,scale*factor));
  x = cx-(cx-x)*next/scale;
  y = cy-(cy-y)*next/scale;
  scale = next;
  draw();
}
function showStart() {
  scale = Math.min(1, Math.max(.78, (viewport.clientWidth - 24) / 980));
  x = 14 - 30 * scale;
  y = 64;
  draw();
}
document.querySelector('#fit').onclick = fit;
const sections = {
  start: showStart,
  activation: () => frame(270,90,730,620),
  expansion: () => frame(1000,90,730,600),
  loyalty: () => frame(1740,90,480,600)
};
document.querySelector('#jump').onchange = event => {
  sections[event.target.value]?.();
  event.target.value = '';
};
for (const [id,factor] of [['in',1.25],['out',.8]]) {
  document.querySelector('#'+id).onclick = () => zoom(factor,viewport.clientWidth/2,viewport.clientHeight/2);
}
viewport.addEventListener('pointerdown',event => {
  if (event.button !== 0 || event.target.closest('button')) return;
  drag = {x:event.clientX-x,y:event.clientY-y};
  viewport.setPointerCapture(event.pointerId);
  viewport.classList.add('dragging');
});
viewport.addEventListener('pointermove',event => {
  if (!drag) return;
  x = event.clientX-drag.x;
  y = event.clientY-drag.y;
  draw();
});
for (const type of ['pointerup','pointercancel','lostpointercapture']) {
  viewport.addEventListener(type,() => { drag = undefined; viewport.classList.remove('dragging'); });
}
viewport.addEventListener('wheel',event => {
  event.preventDefault();
  if (event.ctrlKey || event.metaKey) zoom(Math.exp(-event.deltaY*.007),event.clientX,event.clientY);
  else { x -= event.deltaX; y -= event.deltaY; draw(); }
},{passive:false});
viewport.addEventListener('keydown',event => {
  const offset = {ArrowLeft:[55,0],ArrowRight:[-55,0],ArrowUp:[0,55],ArrowDown:[0,-55]}[event.key];
  if (!offset || event.target !== viewport) return;
  event.preventDefault();
  x += offset[0];
  y += offset[1];
  draw();
});
function select(id) {
  if (selected) buttons[selected].setAttribute('aria-pressed','false');
  selected = id;
  buttons[id].setAttribute('aria-pressed','true');
  document.querySelector('#detail-kind').textContent = cardTypes[id].label;
  document.querySelector('#detail-title').textContent = cards[id][2];
  document.querySelector('#detail-copy').textContent = cards[id][4];
  panel.hidden = false;
  document.querySelector('#close').focus({preventScroll:true});
}
function closeDetails() {
  if (panel.hidden) return;

  buttons[selected].focus({preventScroll:true});
  selected = undefined;
}
document.querySelector('#close').onclick = closeDetails;
window.addEventListener('keydown',event => { if (event.key === 'Escape') closeDetails(); });
window.addEventListener('resize',fit);
// Each lane ends just below its own content; lanes the CEL route crosses extend to cover it.
const laneFloor = {1:650, 2:650, 3:650, 4:680, 5:680, 6:680, 7:680, 8:650};
function sizeBands() {
bands.forEach((band,column) => {
  let bottom = laneFloor[column] || 0;
  for (const [id,node] of Object.entries(buttons)) {
    const inLane = id in groupColumns ? groupColumns[id] === column : cards[id][0] === column;
    if (inLane) bottom = Math.max(bottom, node.offsetTop + node.offsetHeight);
  }
  band.style.height = `${bottom + 22 - (columns[column][1] - 6)}px`;
});
}
// Lines are measured from the cards, so redraw whenever the cards can be measured.
function layout() {
  if (!buttons.referrals.offsetWidth) return;
  drawLinks();
  sizeBands();
}
layout();
showStart();
new ResizeObserver(layout).observe(board);
document.fonts?.ready.then(layout);
window.addEventListener('load', layout);
document.addEventListener('visibilitychange', layout);
