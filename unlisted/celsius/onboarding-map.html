const legend = document.querySelector('#legend-items');
for (const [kind,[label]] of Object.entries(types)) {
  const item = document.createElement('li');
  item.dataset.kind = kind;
  item.textContent = label;
  legend.append(item);
}
for (const [cls,top,height] of [['row-band',80,190],['row-band after',310,430]]) {
  const band = document.createElement('div');
  band.className = cls;
  band.style.cssText = `left:20px;top:${top}px;width:2160px;height:${height}px`;
  board.append(band);
}
for (const [id,[left,top,title,subtitle,,key]] of Object.entries(cards)) {
  const node = document.createElement('button');
  node.type = 'button';
  node.className = key ? 'node key' : 'node';
  const type = cardTypes[id];
  node.dataset.kind = type.kind;
  const badge = document.createElement('span');
  badge.className = 'kind';
  badge.textContent = type.label;
  const name = document.createElement('strong');
  name.textContent = title;
  node.append(badge, name);
  if (subtitle) { const s = document.createElement('span'); s.textContent = subtitle; node.append(s); }
  node.style.cssText = `left:${left}px;top:${top}px`;
  node.setAttribute('aria-pressed','false');
  node.onclick = () => select(id);
  board.append(node);
  buttons[id] = node;
}
function drawLinks() {
  edgeGroup.replaceChildren();
  // Each sequence email has its own exit to the goal, drawn as a shared rail under the row.
  const rail = 668;
  for (const [from,to,route,text] of links) {
    let label = text;
    const a = buttons[from], b = buttons[to];
    const ax = a.offsetLeft, ay = a.offsetTop, bx = b.offsetLeft, by = b.offsetTop;
    const aMid = ay + a.offsetHeight / 2, bMid = by + b.offsetHeight / 2;
    let d, lx, ly, cls = '';
    if (route === 'exit') {
      const x = ax + a.offsetWidth / 2, gx = bx + b.offsetWidth / 2;
      d = from === 'aWelcome'
        ? `M${x} ${ay+a.offsetHeight} V${rail} H${gx} V${by+b.offsetHeight+4}`
        : `M${x} ${ay+a.offsetHeight} V${rail}`;
      if (from === 'aWelcome') { lx = 1810; ly = rail - 9; label = 'Exit criteria: first deposit made'; }
      cls = 'edge-label';
    } else if (route === 'down') {
      const x = bx + b.offsetWidth / 2;
      d = `M${x} ${ay+a.offsetHeight} V${by-4}`;
      lx = x; ly = (ay + a.offsetHeight + by) / 2 + 4;
    } else {
      d = `M${ax+a.offsetWidth} ${aMid} H${bx-4}`;
      lx = (ax + a.offsetWidth + bx) / 2; ly = aMid - 9;
      if (route === 'long') lx = 1390;
    }
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',d);
    if (route !== 'exit' || from === 'aWelcome') path.setAttribute('marker-end','url(#arrow)');
    path.setAttribute('class', route === 'exit' ? 'edge-return' : route === 'long' ? 'edge-automation' : '');
    path.setAttribute('stroke', route === 'exit' ? '#2d6a6a' : '#546d88');
    path.setAttribute('stroke-width', route === 'exit' ? '1.8' : '2.15');
    edgeGroup.append(path);
    if (label && lx) {
      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',lx); t.setAttribute('y',ly);
      t.setAttribute('class', ['First time','Exit criteria: first deposit made'].includes(label) ? 'edge-label' : 'edge-label no');
      t.textContent = label;
      edgeGroup.append(t);
    }
  }
}
let scale = 1, x = 0, y = 0, drag, selected;
function draw() { board.style.transform = `translate(${x}px,${y}px) scale(${scale})`; }
function fit() {
  const width = 2210, height = 750;
  scale = Math.max(.12, Math.min(1.1,(viewport.clientWidth-24)/width,(viewport.clientHeight-84)/height));
  x = (viewport.clientWidth-width*scale)/2;
  y = 56+(viewport.clientHeight-56-height*scale)/2;
  draw();
}
function zoom(factor,cx,cy) {
  const next = Math.max(.12,Math.min(2,scale*factor));
  x = cx-(cx-x)*next/scale; y = cy-(cy-y)*next/scale; scale = next; draw();
}
document.querySelector('#fit').onclick = fit;
for (const [id,factor] of [['in',1.25],['out',.8]]) {
  document.querySelector('#'+id).onclick = () => zoom(factor,viewport.clientWidth/2,viewport.clientHeight/2);
}
viewport.addEventListener('pointerdown',event => {
  if (event.button !== 0 || event.target.closest('button')) return;
  drag = {x:event.clientX-x,y:event.clientY-y};
  viewport.setPointerCapture(event.pointerId);
  viewport.classList.add('dragging');
});
viewport.addEventListener('pointermove',event => { if (!drag) return; x = event.clientX-drag.x; y = event.clientY-drag.y; draw(); });
for (const type of ['pointerup','pointercancel','lostpointercapture']) {
  viewport.addEventListener(type,() => { drag = undefined; viewport.classList.remove('dragging'); });
}
viewport.addEventListener('wheel',event => {
  event.preventDefault();
  if (event.ctrlKey || event.metaKey) zoom(Math.exp(-event.deltaY*.007),event.clientX,event.clientY);
  else { x -= event.deltaX; y -= event.deltaY; draw(); }
},{passive:false});
viewport.addEventListener('keydown',event => {
  const offset = {ArrowLeft:[55,0],ArrowRight:[-55,0],ArrowUp:[0,55],ArrowDown:[0,-55]}[event.key];
  if (!offset || event.target !== viewport) return;
  event.preventDefault(); x += offset[0]; y += offset[1]; draw();
});
function select(id) {
  if (selected) buttons[selected].setAttribute('aria-pressed','false');
  selected = id;
  buttons[id].setAttribute('aria-pressed','true');
  document.querySelector('#detail-kind').textContent = cardTypes[id].label;
  document.querySelector('#detail-title').textContent = cards[id][2];
  document.querySelector('#detail-copy').textContent = cards[id][4];
  panel.hidden = false;
  document.querySelector('#close').focus({preventScroll:true});
}
function closeDetails() {
  if (panel.hidden) return;
  panel.hidden = true;
  buttons[selected].setAttribute('aria-pressed','false');
  buttons[selected].focus({preventScroll:true});
  selected = undefined;
}
document.querySelector('#close').onclick = closeDetails;
window.addEventListener('keydown',event => { if (event.key === 'Escape') closeDetails(); });
window.addEventListener('resize',fit);
function layout() { if (buttons.aWelcome.offsetWidth) drawLinks(); }
layout();
fit();
new ResizeObserver(layout).observe(board);
document.fonts?.ready.then(layout);
window.addEventListener('load', layout);
</script>
</html>
