function drawLinks() {
  edgeGroup.replaceChildren();

    const ax = a.offsetLeft, ay = a.offsetTop, bx = b.offsetLeft, by = b.offsetTop;
    let start = ay + a.offsetHeight / 2, end = by + b.offsetHeight / 2;
    // Leave the nurture group from its upper half and return to its lower half so the paths don't meet.
    if (from === 'nurture') start = end;

    let d, labelX, labelY;

      d = `M${source} ${ay+a.offsetHeight} V730 H${target} V${by+b.offsetHeight+4}`;
      labelX = source;
      labelY = 620;
    } else if (dashed === 'lost') {
      // Declined deals leave the pipeline box level with the closed-lost card.
      d = `M${ax+a.offsetWidth} ${end} H${bx-4}`;
      labelX = 2347;
      labelY = end - 9;
    } else if (dashed === 'not-ready') {
      // Joins the declined line in the gap beside the Capital raise cards.
      d = `M${ax+a.offsetWidth} ${ay+56} H2240 V${end} H${bx-4}`;
      labelX = 2290;
      labelY = 474;
    } else if (dashed === 'recycle') {
      d = `M${ax+a.offsetWidth/2} ${ay+a.offsetHeight} V770 H1490 V560 H${bx+b.offsetWidth+4}`;
      labelX = 1800;
      labelY = 762;
    } else if (dashed === 'drop') {
      const x = ax + a.offsetWidth / 2;
      d = `M${x} ${ay+a.offsetHeight} V${end} H${bx-4}`;
    } else if (dashed === 'flywheel') {
      d = `M${ax+a.offsetWidth/2} ${ay+a.offsetHeight} V848 H14 V${end} H${bx-4}`;
      labelX = 1400;
      labelY = 840;
    } else if (dashed === 'mainshares-route') {
      const out = ax + a.offsetWidth + 14, target = bx + b.offsetWidth / 2;
      d = `M${ax+a.offsetWidth} ${start} H${out} V810 H${target} V${by+b.offsetHeight+4}`;
      labelX = 900;
      labelY = 802;
    } else if (dashed === 'back') {
      d = `M${ax} ${start} H${bx+b.offsetWidth+4}`;
      labelX = (ax + bx + b.offsetWidth) / 2;
      labelY = start - 8;
    } else if (dashed === 'down') {
      const x = bx + b.offsetWidth / 2;
      d = `M${x} ${ay+a.offsetHeight} V${by-3}`;
    } else if (dashed === 'channel-input' || dashed === 'offer-input' || dashed === 'capture-input') {
      const right = ax + a.offsetWidth, gutter = (right + bx) / 2;

      else d = `M${right} ${start} H${gutter} V${end} H${bx-4}`;
    } else if (dashed === 'side' || dashed === 'rsvp-side') {
      const right = ax + a.offsetWidth, targetRight = bx + b.offsetWidth;
      const gutter = Math.max(right, targetRight) + (dashed === 'rsvp-side' ? 24 : 13);
      d = `M${right} ${start} H${gutter} V${end} H${targetRight+4}`;
    } else if (dashed === 'handoff') {
      const right = ax + a.offsetWidth, middle = (right + bx) / 2;
      d = `M${right} ${start} H${middle} V${end} H${bx-4}`;
      labelX = middle;
      labelY = (start + end) / 2;
    } else if (dashed === 'feedback') {
      const left = bx + b.offsetWidth + 19;
      const loop = Math.max(by+b.offsetHeight+24, ay+a.offsetHeight+32);
      const route = ax + a.offsetWidth / 2;
      d = `M${route} ${ay+a.offsetHeight} V${loop} H${left} V${end} H${bx+b.offsetWidth+4}`;
      labelX = (route + left) / 2;
      labelY = loop + 22;
    } else if (cards[from] && cards[to] && cards[from][0] === cards[to][0]) {
      const x = ax + a.offsetWidth / 2;
      labelX = x;
      labelY = (ay + a.offsetHeight + by) / 2 + 4;
      d = by > ay ? `M${x} ${ay+a.offsetHeight} V${by-3}` : `M${x} ${ay} V${by+b.offsetHeight+3}`;
    } else if (bx < ax) {
      d = `M${ax} ${start} C${ax-30} ${start} ${bx+b.offsetWidth+30} ${end} ${bx+b.offsetWidth+3} ${end}`;
    } else {
      const x = ax + a.offsetWidth, middle = (x + bx) / 2;
      d = `M${x} ${start} C${middle} ${start} ${middle} ${end} ${bx-3} ${end}`;
    }
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',d);
    if (dashed !== 'channel-input') path.setAttribute('marker-end','url(#arrow)');
    if (dashed === 'feedback' || dashed === 'back' || dashed === 'flywheel' || dashed === 'recycle') {
      path.setAttribute('class','edge-return');
    } else if (dashed === true || cardTypes[from]?.kind === 'automation' || cardTypes[to]?.kind === 'automation') {
      path.setAttribute('class','edge-automation');
    } else {
      path.setAttribute('stroke-width','2.15');
    }
    edgeGroup.append(path);
    const text = label || (dashed === 'feedback' ? 'Back to nurture' : '');
    if (text) {
      const annotation = document.createElementNS('http://www.w3.org/2000/svg','text');
      annotation.setAttribute('x',labelX);
      annotation.setAttribute('y',labelY);
      annotation.setAttribute('class',['Yes','Qualified','Complete','Straight to Opportunity','Filled'].includes(text) ? 'edge-label' : 'edge-label no');
      annotation.textContent = text;
      edgeGroup.append(annotation);
    }
  }
}
let scale = 1, x = 0, y = 0, drag, selected;
function draw() { board.style.transform = `translate(${x}px,${y}px) scale(${scale})`; }

}
function fit() { frame(4,10,2966,850); }
function zoom(factor,cx,cy) {

}
function showStart() {

}
document.querySelector('#fit').onclick = fit;
const sections = {
  start: showStart,
  capture: () => frame(500,112,490,540),
  activation: () => frame(750,112,480,610),
  readiness: () => frame(1240,90,740,640),

for (const [id,factor] of [['in',1.25],['out',.8]]) {

}
viewport.addEventListener('pointerdown',event => {
  if (event.button !== 0 || event.target.closest('button')) return;

viewport.addEventListener('pointermove',event => {

for (const type of ['pointerup','pointercancel','lostpointercapture']) {

}
viewport.addEventListener('wheel',event => {
  event.preventDefault();

function select(id) {

function closeDetails() {

window.addEventListener('keydown',event => { if (event.key === 'Escape') closeDetails(); });
window.addEventListener('resize',fit);
// Each lane ends just below its own content, so short lanes don't trail empty space.
// Lanes the corporate-newsletter route and nurture loop cross extend to cover them.
const laneFloor = {2:730, 3:730, 4:730, 5:730, 6:600};
function sizeBands() {
bands.forEach((band,column) => {
  let bottom = laneFloor[column] || 0;

}
// Lines are measured from the cards, so redraw them whenever the cards can be measured:
